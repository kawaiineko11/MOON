<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Flip Card Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card-container" id="cardContainer">
    <div class="card" id="card">
      <div class="card-front">
        <img src="images/front.png" alt="Card Front">
      </div>
      <div class="card-back">
        <img id="backImg" src="images/back1.jpg" alt="Card Back">
      </div>
    </div>
  </div>

  <p class="hint">Click!</p>

  <script src="script.js"></script>
</body>
</html>
